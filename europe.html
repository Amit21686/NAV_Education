<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Europe Political Map Offline</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#map{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;overflow:hidden}svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}.country{stroke:#fff;stroke-width:1.05;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;cursor:pointer}
/* Distinct country colours; quiz and preview highlight colours remain higher priority. */
.country{fill:var(--country-color,#8db7a5)}.country.selected{fill:#f2bd72!important;stroke:#f3a93e;stroke-width:2.5}.label{font:700 11px Arial,Helvetica,sans-serif;text-anchor:middle;dominant-baseline:central;fill:#172334;paint-order:stroke;stroke:#fff;stroke-width:2.3px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}.hint{position:fixed;left:50%;bottom:calc(7px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#ffffff9c;background:#0008;border-radius:8px;padding:5px 9px;font:10px Arial,sans-serif;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .6s}.hint.show{opacity:1}.map-controls{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:10;display:flex;gap:9px;align-items:center}.map-btn{border:1px solid #ffffff50;background:#111d;color:#fff;border-radius:14px;min-width:44px;height:44px;padding:0 14px;font:600 14px Arial,sans-serif;box-shadow:0 3px 14px #0008;backdrop-filter:blur(8px)}.map-btn.icon{width:44px;padding:0;font-size:21px}.map-btn.active{background:#e8b45e;color:#111;border-color:#ffe0a0}body.quiz-mode #preview{display:none!important}#quiz-status{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:10;max-width:calc(100vw - 150px);padding:11px 14px;border-radius:12px;background:#111d;color:#fff;border:1px solid #ffffff35;font:600 14px Arial,sans-serif;display:none;backdrop-filter:blur(8px)}#quiz-status small{display:block;font-weight:400;font-size:11px;color:#ffffffb0;margin-top:4px}.country.quiz-target{stroke:#fff!important;stroke-width:2.3!important;stroke-dasharray:4 3;animation:pulse 1.2s infinite}.country.quiz-correct{fill:#20d878!important;stroke:#8bffc0!important;stroke-width:3.5!important;filter:drop-shadow(0 0 5px #20d878)}.country.quiz-wrong{fill:#ff354d!important;stroke:#ff9aa5!important;stroke-width:3.5!important;filter:drop-shadow(0 0 5px #ff354d)}.country.preview-current{fill:#ffd166!important;stroke:#fff0a6!important;stroke-width:3.5!important;filter:drop-shadow(0 0 7px #ffc857)}#preview-panel{position:fixed;z-index:25;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%);width:min(390px,calc(100vw - 24px));display:none;padding:14px 16px;border:1px solid #ffd16666;border-radius:18px;background:linear-gradient(135deg,#20251cF5,#090d12F5);box-shadow:0 14px 44px #000b;color:#fff;font-family:Arial,sans-serif;text-align:center;backdrop-filter:blur(12px)}#preview-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#ffd166;font-weight:700}#preview-name{font-size:24px;font-weight:800;margin:5px 0}#preview-count{font-size:12px;color:#cbd5df;margin-bottom:12px}#preview-actions{display:flex;gap:8px}#preview-actions button{flex:1;border:1px solid #ffffff30;border-radius:11px;padding:10px;background:#ffffff12;color:#fff;font-weight:700}#preview-actions #preview-stop{background:#ffd166;color:#151515;border-color:#ffe6a1}@media(max-width:520px){.map-controls{gap:5px;right:8px}.map-btn{height:40px;padding:0 10px;font-size:12px}.map-btn.icon{width:40px}}@keyframes pulse{50%{stroke:#f5c76e;stroke-width:4}}
#result-overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:22px;background:#000b;backdrop-filter:blur(9px)}
#result-card{width:min(420px,100%);max-height:86dvh;overflow:auto;border:1px solid #ffffff35;border-radius:26px;padding:24px 20px;background:linear-gradient(145deg,#18232b,#090d12 72%);color:#fff;box-shadow:0 20px 70px #000b;font-family:Arial,sans-serif;text-align:center}
#result-card .trophy{font-size:42px;margin-bottom:6px}#result-card h2{font-size:25px;margin:4px 0 8px}#result-card p{color:#b9c6d2;font-size:13px;margin:0 0 18px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 20px}.result-stat{border-radius:16px;padding:16px 8px;background:#ffffff0c;border:1px solid #ffffff18;cursor:pointer;transition:transform .18s,border-color .18s}.result-stat:active{transform:scale(.97)}.result-stat.good{border-color:#38e89a55}.result-stat.retry{border-color:#ff718055}.result-stat strong{display:block;font-size:32px;margin-bottom:5px}.result-stat span{font-size:12px;line-height:1.35;color:#cbd5df}.result-stat.good strong{color:#38e89a}.result-stat.retry strong{color:#ff7180}
#detail-overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:14px;background:radial-gradient(ellipse at top,#17352e 0%,#05080c 58%);color:#fff;font-family:Arial,sans-serif}#detail-card{width:min(520px,100%);height:min(760px,94dvh);display:flex;flex-direction:column;border:1px solid #ffffff24;border-radius:26px;background:linear-gradient(155deg,#15221f,#080d12 72%);box-shadow:0 25px 80px #000c;overflow:hidden}#detail-head{padding:23px 20px 16px;text-align:center;border-bottom:1px solid #ffffff16}#detail-icon{font-size:30px}#detail-title{font-size:23px;margin:8px 0 5px}#detail-subtitle{font-size:12px;color:#aebdc8;margin:0}#detail-list{padding:14px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start} .country-item{min-width:0;display:flex;align-items:center;gap:8px;padding:12px 10px;border-radius:13px;background:#ffffff09;border:1px solid #ffffff13;font-size:12px;font-weight:700;overflow-wrap:anywhere}.country-item .num{flex:0 0 22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#ffffff12;color:#c8d4dc;font-size:10px}.country-item .dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%}.country-item.good .dot{background:#38e89a;box-shadow:0 0 9px #38e89a80}.country-item.retry .dot{background:#ff7180;box-shadow:0 0 9px #ff718080}#detail-empty{grid-column:1/-1;text-align:center;color:#aebdc8;padding:35px 12px;font-size:14px}#detail-back{margin:0 14px 14px;height:46px;border:1px solid #ffffff25;border-radius:14px;background:#ffffff0b;color:#fff;font-size:14px;font-weight:700}#result-again{width:100%;height:48px;border:0;border-radius:14px;background:#36d991;color:#07150e;font-weight:800;font-size:15px;margin-top:4px}#result-close{width:100%;height:42px;border:1px solid #ffffff30;border-radius:14px;background:#ffffff0a;color:#fff;font-weight:600;margin-top:9px}

(()=>{'use strict';
const svg=document.getElementById('svg'),root=document.getElementById('zoom-root'),countries=[...root.querySelectorAll('.country')],labels=[...root.querySelectorAll('.label')];
const resetBtn=document.getElementById('reset'),testBtn=document.getElementById('test'),previewBtn=document.getElementById('preview'),status=document.getElementById('quiz-status');
const resultOverlay=document.getElementById('result-overlay');let oneTapCount=0,multiTapCount=0,questionAttempts=0;const oneTapCountries=[],multiTapCountries=[];
// Give every country a distinct, repeatable colour from a balanced atlas palette.
const countryPalette=['#F4A261','#8ECAE6','#B7E4C7','#E9C46A','#CDB4DB','#90BE6D','#F6BD60','#A8DADC','#FFADAD','#BDE0FE','#D0F4DE','#FFD6A5','#C3AED6','#A7C957','#F28482','#84A59D','#F7D6E0','#9AD1D4','#E6B8A2','#B8C0FF','#D9ED92','#F1C0E8','#A9DEF9','#E4C1F9','#B5EAD7','#FFDAC1','#C7CEEA','#E2F0CB','#FBC4AB','#B9FBC0','#A3C4F3','#FFC6FF'];
countries.forEach((country,index)=>country.style.setProperty('--country-color',countryPalette[index%countryPalette.length]));
// Place each label inside its own country's actual SVG fill, not at hand-written
// approximate coordinates. For each region, search for an interior point with
// the greatest clearance from the sampled boundary, then size the text to fit.
function placeLabelsInsideCountries(){
 const point=svg.createSVGPoint();
 labels.forEach(label=>{
  const country=countries.find(c=>c.dataset.name===label.dataset.name);
  if(!country) return;
  let box; try{box=country.getBBox()}catch(_){return}
  if(!(box.width>0&&box.height>0)) return;
  const boundary=[];
  try{const len=country.getTotalLength(),step=Math.max(1,Math.min(3,len/900));for(let d=0;d<len;d+=step){const q=country.getPointAtLength(d);boundary.push([q.x,q.y])}}catch(_){ }
  let best=null,bestScore=-1;
  for(const divisions of [24,48,84]){
   const x0=best?Math.max(box.x,best.x-box.width/divisions*2):box.x;
   const x1=best?Math.min(box.x+box.width,best.x+box.width/divisions*2):box.x+box.width;
   const y0=best?Math.max(box.y,best.y-box.height/divisions*2):box.y;
   const y1=best?Math.min(box.y+box.height,best.y+box.height/divisions*2):box.y+box.height;
   const n=best?14:divisions;
   for(let ix=0;ix<=n;ix++)for(let iy=0;iy<=n;iy++){
    point.x=x0+(x1-x0)*ix/n;point.y=y0+(y1-y0)*iy/n;
    let inside=false;try{inside=country.isPointInFill(point)}catch(_){ }
    if(!inside)continue;
    let clearance=Infinity;for(const [bx,by] of boundary){const dx=point.x-bx,dy=point.y-by,d=dx*dx+dy*dy;if(d<clearance)clearance=d}
    if(clearance>bestScore){bestScore=clearance;best={x:point.x,y:point.y}}
   }
  }
  if(!best){label.dataset.fitZoom='99';return}
  label.setAttribute('x',best.x.toFixed(2));label.setAttribute('y',best.y.toFixed(2));
  // Verify the complete rendered text rectangle is inside this country's fill.
  // If necessary, reduce the font until every sampled point remains inside.
  let fitted=11,fit=false;

const baseBoxes=(()=>{
 const boxes=countries.map(c=>c.getBBox()).filter(b=>b.width>0||b.height>0);
 const left=Math.min(...boxes.map(b=>b.x)), top=Math.min(...boxes.map(b=>b.y));

 // Bounds after scale-about-center, before translation.
