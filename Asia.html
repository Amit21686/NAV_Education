function placeLabelsInsideCountries(){

 });

 countries.forEach(c=>c.classList.remove('quiz-target','quiz-correct','quiz-wrong'));
 labels.forEach(l=>{l.style.display='';l.classList.remove('quiz-revealed')});
 document.getElementById('one-tap-count').textContent=oneTapCount;
 document.getElementById('multi-tap-count').textContent=multiTapCount;
 document.getElementById('result-subtitle').textContent='You located '+quizFound.size+' of '+countries.length+' regions. Great work!';
 resultOverlay.style.display='flex';document.getElementById('detail-overlay').style.display='none';status.style.display='none';
}
// Automatically pan and zoom to the country being asked, as in the original Smart Test.
function focusCountry(c){
 if(!c)return;
 let b;try{b=c.getBBox()}catch(_){return}
 const cx=b.x+b.width/2,cy=b.y+b.height/2;
 const span=Math.max(b.width,b.height,8);
 const targetZ=Math.max(2.2,Math.min(100,560/span));
 view.z=targetZ;view.x=-(cx-500)*targetZ;view.y=-(cy-500)*targetZ;apply();
}
function nextQuestion(){
 const remaining=countries.filter(c=>!quizFound.has(c.dataset.name));
 if(!remaining.length){showResults();return}
 question=remaining[Math.floor(Math.random()*remaining.length)];questionAttempts=0;
 status.innerHTML='<strong>'+question.dataset.name.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</strong>';
 focusCountry(question);
}
function startTest(){if(previewActive)stopPreview();document.body.classList.add('quiz-mode');resultOverlay.style.display='none';quizMode=true;quizFound.clear();oneTapCount=0;multiTapCount=0;questionAttempts=0;oneTapCountries.length=0;multiTapCountries.length=0;clearSelected();countries.forEach(c=>c.classList.remove('quiz-target','quiz-correct','quiz-wrong'));hideAllLabels();testBtn.classList.add('active');testBtn.textContent='Exit test';status.style.display='block';nextQuestion()}
function exitTest(){document.body.classList.remove('quiz-mode');quizMode=false;question=null;countries.forEach(c=>c.classList.remove('quiz-target','quiz-correct','quiz-wrong'));labels.forEach(l=>{l.style.display='';l.classList.remove('quiz-revealed')});testBtn.classList.remove('active');testBtn.textContent='Test';status.style.display='none';resultOverlay.style.display='none'}
function openCountryList(type){const isGood=type==='good';const names=isGood?oneTapCountries:multiTapCountries;document.getElementById('detail-icon').textContent=isGood?'✓':'↻';document.getElementById('detail-icon').style.color=isGood?'#38e89a':'#ff7180';document.getElementById('detail-title').textContent=isGood?'Correct in 1 Tap':'Needed More Than 1 Tap';document.getElementById('detail-title').style.color=isGood?'#38e89a':'#ff8793';document.getElementById('detail-subtitle').textContent=names.length+' '+(names.length===1?'country':'countries')+(isGood?' identified on the first try':' that took multiple taps');const list=document.getElementById('detail-list');list.innerHTML='';if(!names.length){list.innerHTML='<div id="detail-empty">'+(isGood?'No countries were answered correctly on the first tap yet.':'No countries needed more than one tap. Great job!')+'</div>'}else{names.forEach((name,i)=>{const row=document.createElement('div');row.className='country-item '+(isGood?'good':'retry');const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const dot=document.createElement('span');dot.className='dot';const label=document.createElement('span');label.textContent=name;row.append(num,dot,label);list.appendChild(row)})}document.getElementById('detail-overlay').style.display='flex'}
document.querySelector('.result-stat.good').addEventListener('click',()=>openCountryList('good'));document.querySelector('.result-stat.retry').addEventListener('click',()=>openCountryList('retry'));document.getElementById('detail-back').addEventListener('click',()=>document.getElementById('detail-overlay').style.display='none');
document.getElementById('result-again').addEventListener('click',startTest);
document.getElementById('result-close').addEventListener('click',()=>{resultOverlay.style.display='none';document.body.classList.remove('quiz-mode');labels.forEach(l=>l.style.display='');status.style.display='none'});
testBtn.addEventListener('click',()=>{if(quizMode)exitTest();else startTest()});
previewBtn.addEventListener('click',()=>{if(previewActive)stopPreview();else startPreview()});document.getElementById('preview-pause').addEventListener('click',togglePreviewPause);document.getElementById('preview-stop').addEventListener('click',()=>stopPreview());
resetBtn.addEventListener('click',resetView);
function midPoint(a,b){return {clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2}}
function svgPointFromClient(p){return point({clientX:p.x,clientY:p.y})}
svg.addEventListener('pointerdown',e=>{
 e.preventDefault();
 try{svg.setPointerCapture(e.pointerId)}catch{}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 moved=false;
 startTap={x:e.clientX,y:e.clientY,target:e.target.closest?.('.country')|| (e.target.dataset?.country ? countries.find(c=>c.dataset.name===e.target.dataset.country) : null)||null};
 if(pointers.size===1){const q=svgPointFromClient(pointers.get(e.pointerId));drag={x:q.x,y:q.y,ox:view.x,oy:view.y};pinch=null}
 else if(pointers.size===2){const a=[...pointers.values()];const m=midPoint(a[0],a[1]);const center=point(m);pinch={dist:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),z:view.z,x:view.x,y:view.y,center};drag=null;startTap=null}
});
svg.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(startTap&&Math.hypot(e.clientX-startTap.x,e.clientY-startTap.y)>7)moved=true;
 if(pointers.size>=2){
  const a=[...pointers.values()];
  const dist=Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));
  const center=point(midPoint(a[0],a[1]));
  if(pinch){
   const z=Math.max(1,Math.min(100,pinch.z*dist/pinch.dist));
   // Keep the original map point beneath the moving midpoint between the fingers.
   const worldX=500+(pinch.center.x-500-pinch.x)/pinch.z;
   const worldY=500+(pinch.center.y-500-pinch.y)/pinch.z;
   view.z=z;
   view.x=center.x-500-(worldX-500)*z;
   view.y=center.y-500-(worldY-500)*z;
   apply();
  }
  return;
 }
 if(drag){const q=svgPointFromClient({x:e.clientX,y:e.clientY});view.x=drag.ox+(q.x-drag.x);view.y=drag.oy+(q.y-drag.y);apply()}
});
function end(e){
 const tap=startTap;
 pointers.delete(e.pointerId);
 if(pointers.size<2)pinch=null;
 if(!pointers.size){
  if(tap&&!moved&&tap.target){const c=tap.target;if(quizMode){if(question&&c===question){if(questionAttempts===0){oneTapCount++;oneTapCountries.push(c.dataset.name)}else{multiTapCount++;multiTapCountries.push(c.dataset.name)}quizFound.add(c.dataset.name);c.classList.remove('quiz-target','quiz-wrong');c.classList.add('quiz-correct');status.innerHTML='<span style="color:#38e89a">✓ Correct!</span> <strong>'+c.dataset.name+'</strong>';const l=labels.find(x=>x.dataset.name===c.dataset.name);if(l){l.style.display='';l.classList.add('quiz-revealed')}question=null;setTimeout(()=>{c.classList.remove('quiz-correct');nextQuestion()},350)}else if(question){questionAttempts++;c.classList.remove('quiz-correct');c.classList.add('quiz-wrong');status.innerHTML='<span style="color:#ff7180">✕ Incorrect!</span> <strong>'+c.dataset.name+'</strong><small>Find: '+question.dataset.name+'</small>';setTimeout(()=>c.classList.remove('quiz-wrong'),400)}}else{if(selected)selected.classList.remove('selected');selected=c;selected.classList.add('selected')}}
  drag=null;startTap=null;
 }else if(pointers.size===1){const p=[...pointers.values()][0],q=svgPointFromClient(p);drag={x:q.x,y:q.y,ox:view.x,oy:view.y};startTap=null}
}
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId))end(e)});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(view.z*(e.deltaY<0?1.15:1/1.15),point(e))},{passive:false});svg.addEventListener('dblclick',e=>{e.preventDefault();zoomAt(view.z*1.5,point(e))});
// Keep the original map fully in view at startup and when the device rotates.
window.addEventListener('resize',apply);apply();
const hint=document.getElementById('hint');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),3200);
})();</script></body></html>
